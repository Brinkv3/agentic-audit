<svg viewBox="0 0 780 720" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Agentic Audit — Pipeline Architecture</title>
  <desc>Architecture diagram showing the multi-agent pipeline: engagement docs and interview artifacts flow through six specialized agents to produce a client-ready Excel deliverable.</desc>

  <style>
    .box-navy { fill: #1e3a5f; rx: 10; ry: 10; }
    .box-amber { fill: #d97706; rx: 10; ry: 10; }
    .box-amber-light { fill: #f59e0b; rx: 10; ry: 10; }
    .box-slate { fill: #5b6b7d; rx: 10; ry: 10; }
    .box-green { fill: #22c55e; rx: 10; ry: 10; }
    .box-white { fill: #ffffff; rx: 10; ry: 10; stroke: #1e293b; stroke-width: 1.5; }
    .box-label { fill: #fff; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
    .box-label-dark { fill: #1e293b; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
    .box-sub { fill: rgba(255,255,255,0.85); font-family: system-ui, sans-serif; font-size: 10px; text-anchor: middle; dominant-baseline: central; }
    .box-sub-dark { fill: #64748b; font-family: system-ui, sans-serif; font-size: 10px; text-anchor: middle; dominant-baseline: central; }
    .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .arrow-bold { stroke: #d97706; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-amber); }
    .arrow-dash { stroke: #64748b; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowhead-gray); }
    .phase-label { fill: #64748b; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .phase-tag { fill: #ffffff; font-family: system-ui, sans-serif; font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .section-bg { fill: #f8fafc; rx: 12; ry: 12; opacity: 0.5; }
    .repeat-bg { fill: #fffbeb; rx: 12; ry: 12; opacity: 0.4; stroke: #d97706; stroke-width: 1; stroke-dasharray: 8 4; }
    .data-label { fill: #475569; font-family: system-ui, sans-serif; font-size: 10px; font-style: italic; text-anchor: middle; dominant-baseline: central; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8" />
    </marker>
    <marker id="arrowhead-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
  </defs>

  <!-- ===== Inputs ===== -->
  <text class="phase-label" x="50" y="30">Inputs</text>

  <rect class="box-white" x="50" y="45" width="180" height="50" />
  <text class="box-label-dark" x="140" y="63">Engagement Docs</text>
  <text class="box-sub-dark" x="140" y="80">SOWs, project plans, scoping</text>

  <rect class="box-white" x="420" y="45" width="180" height="50" />
  <text class="box-label-dark" x="510" y="63">Interview Artifacts</text>
  <text class="box-sub-dark" x="510" y="80">Transcripts, notes, docs</text>

  <!-- Configurable principles (side input) -->
  <rect class="box-white" x="620" y="45" width="140" height="50" />
  <text class="box-label-dark" x="690" y="63">Principles</text>
  <text class="box-sub-dark" x="690" y="80">JSON config</text>

  <!-- ===== Phase A: Question Framework ===== -->
  <rect class="section-bg" x="20" y="115" width="300" height="90" />
  <rect class="box-slate" x="30" y="120" width="60" height="20" rx="4" ry="4" />
  <text class="phase-tag" x="60" y="130">PHASE A</text>

  <line class="arrow" x1="140" y1="95" x2="140" y2="140" />

  <rect class="box-amber" x="50" y="140" width="250" height="50" />
  <text class="box-label" x="175" y="158">Question Generation Agent</text>
  <text class="box-sub" x="175" y="175">question_gen.py · LLM tool calling</text>

  <!-- Output: QuestionFramework -->
  <line class="arrow" x1="175" y1="190" x2="175" y2="225" />
  <text class="data-label" x="260" y="215">QuestionFramework (locked)</text>

  <!-- ===== Phase C: Per-Interview Pipeline (repeatable) ===== -->
  <rect class="repeat-bg" x="20" y="225" width="740" height="300" />
  <rect class="box-slate" x="30" y="232" width="60" height="20" rx="4" ry="4" />
  <text class="phase-tag" x="60" y="242">PHASE C</text>
  <text class="phase-label" x="100" y="242">Repeat per application</text>

  <!-- Intake Agent -->
  <line class="arrow-bold" x1="175" y1="225" x2="175" y2="270" />
  <line class="arrow" x1="510" y1="95" x2="510" y2="270" />

  <rect class="box-amber" x="120" y="270" width="440" height="50" />
  <text class="box-label" x="340" y="288">Intake Agent</text>
  <text class="box-sub" x="340" y="305">intake.py · Parse, tag, extract metadata · LLM tool calling</text>

  <line class="arrow-bold" x1="340" y1="320" x2="340" y2="350" />
  <text class="data-label" x="440" y="340">InterviewInputs</text>

  <!-- Answer Agent -->
  <rect class="box-amber" x="120" y="350" width="440" height="50" />
  <text class="box-label" x="340" y="368">Answer Agent</text>
  <text class="box-sub" x="340" y="385">answer.py · Per-question synthesis · Factual vs. anecdotal classification</text>

  <line class="arrow-bold" x1="340" y1="400" x2="340" y2="425" />
  <text class="data-label" x="440" y="418">AnsweredQuestion[]</text>

  <!-- Analysis + Validation side by side -->
  <rect class="box-amber" x="60" y="425" width="250" height="50" />
  <text class="box-label" x="185" y="443">Analysis Agent</text>
  <text class="box-sub" x="185" y="460">analysis.py · Evaluate against principles</text>

  <rect class="box-amber" x="370" y="425" width="250" height="50" />
  <text class="box-label" x="495" y="443">Validation Agent</text>
  <text class="box-sub" x="495" y="460">validation.py · Cross-check, conflicts, confidence</text>

  <!-- Principles input to Analysis -->
  <line class="arrow-dash" x1="690" y1="95" x2="690" y2="400" />
  <line class="arrow-dash" x1="690" y1="400" x2="310" y2="400" />
  <line class="arrow-dash" x1="310" y1="400" x2="310" y2="425" />

  <line class="arrow-bold" x1="185" y1="475" x2="185" y2="510" />
  <line class="arrow-bold" x1="495" y1="475" x2="495" y2="510" />
  <text class="data-label" x="130" y="500">Finding[]</text>
  <text class="data-label" x="570" y="500">Validated answers</text>

  <!-- AppResult output -->
  <rect class="box-navy" x="240" y="510" width="200" height="30" rx="6" ry="6" />
  <text class="box-label" x="340" y="525">AppResult</text>

  <!-- ===== Phase D: Synthesis & Deliverable ===== -->
  <rect class="section-bg" x="20" y="555" width="740" height="150" />
  <rect class="box-slate" x="30" y="562" width="60" height="20" rx="4" ry="4" />
  <text class="phase-tag" x="60" y="572">PHASE D</text>

  <line class="arrow-bold" x1="340" y1="540" x2="340" y2="585" />

  <!-- Synthesis Agent -->
  <rect class="box-amber" x="120" y="585" width="440" height="50" />
  <text class="box-label" x="340" y="603">Synthesis Agent</text>
  <text class="box-sub" x="340" y="620">synthesis.py · Executive summary + AI observations + coverage matrix</text>

  <line class="arrow-bold" x1="340" y1="635" x2="340" y2="660" />

  <!-- Excel Output -->
  <rect class="box-green" x="200" y="660" width="280" height="50" />
  <text class="box-label" x="340" y="678">Excel Deliverable</text>
  <text class="box-sub" x="340" y="695">excel_output.py · Per-app tabs, coverage matrix, gaps, observations</text>

  <!-- LLM Adapter callout -->
  <rect class="box-white" x="610" y="585" width="140" height="50" />
  <text class="box-label-dark" x="680" y="603">llm-adapter</text>
  <text class="box-sub-dark" x="680" y="620">Provider-agnostic</text>

  <line class="arrow-dash" x1="610" y1="610" x2="560" y2="610" />

</svg>

<svg viewBox="0 0 780 870" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Agentic Audit — Pipeline Architecture</title>
  <desc>Architecture diagram showing the full audit workflow: engagement docs flow through question generation (Phase A), human-led interviews and team deliberation (Phase B), automated multi-agent processing (Phase C), and synthesis into a client deliverable (Phase D).</desc>

  <style>
    .box-navy { fill: #1e3a5f; rx: 10; ry: 10; }
    .box-amber { fill: #d97706; rx: 10; ry: 10; }
    .box-slate { fill: #5b6b7d; rx: 10; ry: 10; }
    .box-green { fill: #22c55e; rx: 10; ry: 10; }
    .box-teal { fill: #0d9488; rx: 10; ry: 10; }
    .box-white { fill: #ffffff; rx: 10; ry: 10; stroke: #1e293b; stroke-width: 1.5; }
    .box-label { fill: #fff; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
    .box-label-dark { fill: #1e293b; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
    .box-sub { fill: rgba(255,255,255,0.85); font-family: system-ui, sans-serif; font-size: 10px; text-anchor: middle; dominant-baseline: central; }
    .box-sub-dark { fill: #64748b; font-family: system-ui, sans-serif; font-size: 10px; text-anchor: middle; dominant-baseline: central; }
    .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .arrow-bold { stroke: #d97706; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-amber); }
    .arrow-teal { stroke: #0d9488; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-teal); }
    .arrow-dash { stroke: #64748b; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowhead-gray); }
    .phase-label { fill: #64748b; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .phase-tag { fill: #ffffff; font-family: system-ui, sans-serif; font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .section-bg { fill: #f8fafc; rx: 12; ry: 12; opacity: 0.5; }
    .human-bg { fill: #f0fdfa; rx: 12; ry: 12; opacity: 0.5; stroke: #0d9488; stroke-width: 1; stroke-dasharray: 8 4; }
    .repeat-bg { fill: #fffbeb; rx: 12; ry: 12; opacity: 0.4; stroke: #d97706; stroke-width: 1; stroke-dasharray: 8 4; }
    .data-label { fill: #475569; font-family: system-ui, sans-serif; font-size: 10px; font-style: italic; text-anchor: middle; dominant-baseline: central; }
    .human-icon { fill: #0d9488; font-family: system-ui, sans-serif; font-size: 18px; text-anchor: middle; dominant-baseline: central; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8" />
    </marker>
    <marker id="arrowhead-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706" />
    </marker>
    <marker id="arrowhead-teal" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d9488" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
  </defs>

  <!-- ===== Inputs ===== -->
  <text class="phase-label" x="50" y="30">Inputs</text>

  <rect class="box-white" x="50" y="45" width="180" height="50" />
  <text class="box-label-dark" x="140" y="63">Engagement Docs</text>
  <text class="box-sub-dark" x="140" y="80">SOWs, project plans, scoping</text>

  <rect class="box-white" x="310" y="45" width="200" height="50" />
  <text class="box-label-dark" x="410" y="63">Question Framework</text>
  <text class="box-sub-dark" x="410" y="80">User-uploaded Excel / JSON</text>

  <!-- Configurable principles (side input) -->
  <rect class="box-white" x="600" y="45" width="160" height="50" />
  <text class="box-label-dark" x="680" y="63">Principles</text>
  <text class="box-sub-dark" x="680" y="80">JSON config</text>

  <!-- ===== Phase A: Question Framework ===== -->
  <rect class="section-bg" x="20" y="115" width="560" height="90" />
  <rect class="box-slate" x="30" y="120" width="60" height="20" rx="4" ry="4" />
  <text class="phase-tag" x="60" y="130">PHASE A</text>

  <line class="arrow" x1="140" y1="95" x2="140" y2="140" />

  <rect class="box-amber" x="50" y="140" width="250" height="50" />
  <text class="box-label" x="175" y="158">Question Generation Agent</text>
  <text class="box-sub" x="175" y="175">question_gen.py · LLM tool calling</text>

  <!-- User-uploaded path -->
  <line class="arrow" x1="410" y1="95" x2="410" y2="140" />
  <rect class="box-teal" x="370" y="140" width="190" height="50" />
  <text class="box-label" x="465" y="158">Load Questions</text>
  <text class="box-sub" x="465" y="175">Excel (.xlsx) or JSON upload</text>

  <!-- Mode label -->
  <text class="data-label" x="340" y="135">Generate, upload, or both</text>

  <!-- Both paths merge to QuestionFramework -->
  <line class="arrow" x1="175" y1="190" x2="175" y2="210" />
  <line class="arrow" x1="175" y1="210" x2="290" y2="218" />
  <line class="arrow" x1="465" y1="190" x2="465" y2="210" />
  <line class="arrow" x1="465" y1="210" x2="355" y2="218" />

  <!-- Output: QuestionFramework -->
  <rect class="box-navy" x="240" y="208" width="200" height="24" rx="6" ry="6" />
  <text class="box-label" x="340" y="220" style="font-size: 11px;">QuestionFramework (locked)</text>

  <!-- ===== Phase B: Human — Interviews & Deliberation ===== -->
  <rect class="human-bg" x="20" y="225" width="740" height="145" />
  <rect class="box-teal" x="30" y="232" width="60" height="20" rx="4" ry="4" />
  <text class="phase-tag" x="60" y="242">PHASE B</text>
  <text class="phase-label" x="100" y="242">Human-in-the-loop</text>

  <line class="arrow-teal" x1="175" y1="225" x2="175" y2="265" />

  <!-- Conduct Interviews -->
  <rect class="box-teal" x="60" y="265" width="300" height="50" />
  <text class="box-label" x="210" y="283">Conduct Interviews</text>
  <text class="box-sub" x="210" y="300">Consultants interview stakeholders per application</text>

  <line class="arrow-teal" x1="210" y1="315" x2="210" y2="335" />

  <!-- Post-Interview Deliberation -->
  <rect class="box-teal" x="60" y="335" width="300" height="50" rx="10" ry="10" />
  <text class="box-label" x="210" y="353">Team Deliberation</text>
  <text class="box-sub" x="210" y="370">Debrief — compare what each consultant heard, initial responses, calibrate</text>

  <!-- Outputs of Phase B -->
  <rect class="box-white" x="430" y="275" width="190" height="44" />
  <text class="box-label-dark" x="525" y="290">Interview Artifacts</text>
  <text class="box-sub-dark" x="525" y="306">Transcripts, notes, docs</text>

  <rect class="box-white" x="430" y="335" width="190" height="50" />
  <text class="box-label-dark" x="525" y="353">Debrief Notes</text>
  <text class="box-sub-dark" x="525" y="370">Initial impressions, alignment</text>

  <line class="arrow-teal" x1="360" y1="290" x2="430" y2="290" />
  <line class="arrow-teal" x1="360" y1="360" x2="430" y2="360" />

  <!-- ===== Phase C: Per-Interview Pipeline (repeatable) ===== -->
  <rect class="repeat-bg" x="20" y="390" width="740" height="300" />
  <rect class="box-slate" x="30" y="397" width="60" height="20" rx="4" ry="4" />
  <text class="phase-tag" x="60" y="407">PHASE C</text>
  <text class="phase-label" x="100" y="407">Repeat per application</text>

  <!-- Intake Agent -->
  <line class="arrow-bold" x1="175" y1="385" x2="175" y2="432" />
  <line class="arrow" x1="525" y1="385" x2="525" y2="420" />
  <line class="arrow" x1="525" y1="420" x2="475" y2="432" />

  <rect class="box-amber" x="120" y="432" width="440" height="50" />
  <text class="box-label" x="340" y="450">Intake Agent</text>
  <text class="box-sub" x="340" y="467">intake.py · Parse, tag, extract metadata · LLM tool calling</text>

  <line class="arrow-bold" x1="340" y1="482" x2="340" y2="510" />
  <text class="data-label" x="440" y="500">InterviewInputs</text>

  <!-- Answer Agent -->
  <rect class="box-amber" x="120" y="510" width="440" height="50" />
  <text class="box-label" x="340" y="528">Answer Agent</text>
  <text class="box-sub" x="340" y="545">answer.py · Per-question synthesis · Factual vs. anecdotal classification</text>

  <line class="arrow-bold" x1="340" y1="560" x2="340" y2="585" />
  <text class="data-label" x="440" y="578">AnsweredQuestion[]</text>

  <!-- Analysis + Validation side by side -->
  <rect class="box-amber" x="60" y="585" width="250" height="50" />
  <text class="box-label" x="185" y="603">Analysis Agent</text>
  <text class="box-sub" x="185" y="620">analysis.py · Evaluate against principles</text>

  <rect class="box-amber" x="370" y="585" width="250" height="50" />
  <text class="box-label" x="495" y="603">Validation Agent</text>
  <text class="box-sub" x="495" y="620">validation.py · Cross-check, conflicts, confidence</text>

  <!-- Principles input to Analysis -->
  <line class="arrow-dash" x1="680" y1="95" x2="680" y2="565" />
  <line class="arrow-dash" x1="680" y1="565" x2="310" y2="565" />
  <line class="arrow-dash" x1="310" y1="565" x2="310" y2="585" />

  <line class="arrow-bold" x1="185" y1="635" x2="185" y2="670" />
  <line class="arrow-bold" x1="495" y1="635" x2="495" y2="670" />
  <text class="data-label" x="130" y="660">Finding[]</text>
  <text class="data-label" x="570" y="660">Validated answers</text>

  <!-- AppResult output -->
  <rect class="box-navy" x="240" y="670" width="200" height="30" rx="6" ry="6" />
  <text class="box-label" x="340" y="685">AppResult</text>

  <!-- ===== Phase D: Synthesis & Deliverable ===== -->
  <rect class="section-bg" x="20" y="715" width="740" height="145" />
  <rect class="box-slate" x="30" y="722" width="60" height="20" rx="4" ry="4" />
  <text class="phase-tag" x="60" y="732">PHASE D</text>

  <line class="arrow-bold" x1="340" y1="700" x2="340" y2="745" />

  <!-- Synthesis Agent -->
  <rect class="box-amber" x="120" y="745" width="440" height="50" />
  <text class="box-label" x="340" y="763">Synthesis Agent</text>
  <text class="box-sub" x="340" y="780">synthesis.py · Executive summary + AI observations + coverage matrix</text>

  <line class="arrow-bold" x1="340" y1="795" x2="340" y2="820" />

  <!-- Excel Output -->
  <rect class="box-green" x="200" y="820" width="280" height="40" />
  <text class="box-label" x="340" y="840">Excel Deliverable</text>

  <!-- LLM Adapter callout -->
  <rect class="box-white" x="610" y="745" width="140" height="50" />
  <text class="box-label-dark" x="680" y="763">llm-adapter</text>
  <text class="box-sub-dark" x="680" y="780">Provider-agnostic</text>

  <line class="arrow-dash" x1="610" y1="770" x2="560" y2="770" />

</svg>
